<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Shelter Login | Dogs of Europe</title>
  <link rel="stylesheet" href="home.css">
  <link rel="stylesheet" href="search-results.css">
  <link rel="stylesheet" href="dog-profile.css">
  <link rel="stylesheet" href="shelter-log-in.css" />
</head>
<body>

    <body>

        <div class="container header__logo" role="banner">
            <a href="/" aria-label="Dogs of Europe Home">
              <img src="images/logo.png" alt="Dogs of Europe logo" />
            </a>
          </div>
          
        <!-- LOGIN FORM -->
        <main class="login-page">
          <section class="login-container">
            <h1 class="login-title">Shelter Login</h1>
            <form action="/shelter-dashboard" method="POST" class="login-form">
              
              <label for="email">Email Address</label>
              <input type="email" id="email" name="email" required placeholder="you@example.com" />
      
              <label for="password">Password</label>
              <input type="password" id="password" name="password" required placeholder="Enter your password" />
      
              <button type="submit" class="login-button">Log In</button>
      
              <p class="login-help">
                Forgot your password? <a href="/reset-password">Reset it here</a>.
              </p>
            </form>
          </section>
        </main>
      
      </body>
