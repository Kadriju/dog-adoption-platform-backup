<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Find your new dog companion and give a loving dog a home. Dogs of Europe - adoption platform." />
  <title>Dogs of Europe | Find Your New Companion</title>
  <link rel="icon" href="images/favicon.ico" type="image/x-icon" />
  <link rel="stylesheet" href="styles.css" />

  <!-- Structured Data for SEO -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Dogs of Europe",
      "url": "https://www.dogsofeurope.com",
      "logo": "https://www.dogsofeurope.com/images/logo.png",
      "description": "Find your new dog companion and give a loving dog a home.",
      "sameAs": [
        "https://www.dogsofeurope.com",
        "https://www.dogsofeurope.org",
        "https://www.dogsofeurope.eu"
      ]
    }
  </script>
</head>

<body>

  <!-- Header and Navigation -->
  <header>
    <div class="header-layout">
      <div class="logo">
        <img src="images/logo.png" alt="Dogs of Europe Logo" />
      </div>
  
      <nav class="main-nav">
        <ul class="nav-list">
          <li><a href="#">Home</a></li>
          <li><a href="#">Our Mission</a></li>
          <li><a href="#">Donate</a></li>
          <li><a href="#">Useful Info & Links</a></li>
          <li><a href="#">Happy Stories</a></li>
        </ul>
      </nav>
  
      <div class="language-menu">
        <img src="images/uk-flag.png" alt="UK Flag" />
      </div>
    </div>
  </header>
  
  
  <!-- Main Content -->
  <main>

    <!-- Hero Section -->
    <section aria-labelledby="main-heading">
      <h1 id="main-heading" class="main-heading">Find Your New Companion!</h1>
      <p class="sub-heading">Give a loving dog a home ❤️</p>
    </section>

    <!-- Search Form Section -->
    <section class="search-container">
      <div class="search-sidebar">
        <h2>Dog Search <img src="images/mascot.png" alt="Mascot Dog" width="40" height="40" /></h2>
      </div>

      <form class="search-form" action="#" method="GET">
        <div class="filter-group">
          <label>Sex:</label>
          <label><input type="radio" name="sex" value="all" checked /> All</label>
          <label><input type="radio" name="sex" value="female" /> Female</label>
          <label><input type="radio" name="sex" value="male" /> Male</label>
        </div>

        <div class="filter-group">
          <label>Age:</label>
          <label><input type="radio" name="age" value="0-1" /> 0-1 year</label>
          <label><input type="radio" name="age" value="1-5" /> 1-5 years</label>
          <label><input type="radio" name="age" value="6+" /> 6+ years</label>
        </div>

        <div class="filter-group">
          <label>Size:</label>
          <label><input type="checkbox" name="size" value="small" /> Small</label>
          <label><input type="checkbox" name="size" value="medium" /> Medium</label>
          <label><input type="checkbox" name="size" value="large" /> Large</label>
          <label><input type="checkbox" name="size" value="xlarge" /> X-Large</label>
        </div>

        <div class="filter-group">
          <label>Country:</label>
          <select name="country">
            <option value="">-- Select Country --</option>
            <option value="estonia">Estonia</option>
            <option value="latvia">Latvia</option>
            <option value="lithuania">Lithuania</option>
          </select>
        </div>

        <div class="filter-group">
          <label>ID Number:</label>
          <input type="text" name="id" placeholder="ID Search" />
        </div>

        <button class="submit-button" type="submit">Search</button>
      </form>
    </section>

 <!-- Gallery Section -->
<section aria-labelledby="gallery-heading">
  <h2 id="gallery-heading" class="gallery-heading">Bringing love, company &amp; joy into your life!</h2>
  <ul class="image-gallery">
    <li><img src="images/image1.jpg" alt="Loving dog" /></li>
    <li><img src="images/image2.jpg" alt="Grateful dog" /></li>
    <li><img src="images/image3.jpg" alt="Your companion" /></li>
    <li><img src="images/image4.jpg" alt="Your best friend" /></li>
    <li><img src="images/image5.jpg" alt="Your guardian" /></li>
    <li><img src="images/image6.jpg" alt="Bringing joy" /></li>
  </ul>
</section>

</main>

<footer>
  <p>&copy; 2025 Dogs of Europe | <a href="#">Contact</a> | <a href="#">Links</a></p>
</footer>

</body>
</html>
