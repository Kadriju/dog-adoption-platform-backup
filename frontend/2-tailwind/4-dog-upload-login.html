        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 items-stretch justify-items-center">
          

          <!-- Shelter Login -->

              </div>

                type="submit" form="login-form">

            </div>
          </div>

                    <option value="1">1 dog</option>
                    <option value="2">2 dogs</option>
                    <option value="3">3 dogs</option>
                    <option value="4">4 dogs</option>
                    <option value="5">5 dogs</option>
                    <option value="6">6 dogs</option>
                    <option value="7">7 dogs</option>
                    <option value="8">8 dogs</option>
                    <option value="9">9 dogs</option>

                    <option value="8">8 dogs</option>
                    <option value="9">9 dogs</option>
                    <option value="10">10 dogs</option>
                    <option value="11">11 dogs</option>

  <!-- Tiny script to enable button only when checkbox is checked -->
      <script>
      document.addEventListener('DOMContentLoaded', () => {
        // Define both forms’ checkbox/button pairs
        const forms = [
          { checkboxId: 'breederCheck', buttonId: 'breederUploadButton' },
          { checkboxId: 'privateCheck', buttonId: 'privateUploadButton' },
        ];

        forms.forEach(({ checkboxId, buttonId }) => {
          const checkbox = document.getElementById(checkboxId);
          const button = document.getElementById(buttonId);

          if (checkbox && button) {
            const setState = () => {
              const enabled = checkbox.checked;
              button.disabled = !enabled;
              button.className = enabled
                ? 'mt-6 w-full p-2 bg-[#2b7a78] hover:bg-[#205e5b] text-white rounded-lg text-base font-bold tracking-wider relative top-0 shadow-[0_0.09375rem_0_#205e5b,0_0.04375rem_0.125rem_rgba(0,0,0,0.15)] transition-colors'
                : 'mt-6 w-full p-2 bg-gray-400 text-white rounded-lg text-base font-bold tracking-wider cursor-not-allowed relative top-0 shadow-[0_0.09375rem_0_#205e5b,0_0.04375rem_0.125rem_rgba(0,0,0,0.15)] transition-colors';
            };

            // Initialize state and listen for changes
            setState();
            checkbox.addEventListener('change', setState);
          }
        });
      });
    </script>
