    />

      name="twitter:title"

    <meta
      name="twitter:description"

    <script type="application/ld+json">

        "logo": "https://www.dogeli.com/4-images/logoheader.png",

  <body class="bg-sage-green font-sans antialiased">
    <div data-include="3-html-partials/header.html"></div>

    <!-- Main Content -->

    <main id="main-content" role="main">
      <!-- Hero Section -->

      <section aria-labelledby="main-heading" class="bg-sage-green text-center">

          <h1
            id="main-heading"
            class="text-warm-golden-yellow animate-glow mb-0 pt-[0.6rem] text-[2.1rem] leading-[1.3] font-semibold"
          >
            Find Your New Best Friend !
          </h1>
          <p
            class="text-warm-white mt-0 text-[1.3rem] leading-[1.1] font-medium"
          >
            <span
              class="text-medium-salmon mx-[0.5rem] align-middle text-[2.6rem]"
              >♥</span
            >
            Give a loving home to a grateful dog
            <span
              class="text-medium-salmon mx-[0.5rem] align-middle text-[2.6rem]"
              >♥</span
            >
          </p>
        </div>
      </section>

      <!-- Search Section -->

      >
        <!-- Sidebar -->
        <div

        >
          <h2
            class="text-soft-dark-purple text-[1.7rem] leading-[1.1] font-medium"
          >
            Dog Search
            <i class="fa-solid fa-location-dot align-middle"></i>
          </h2>

          <div class="relative inline-block">
            <img
              src="4-images/mascot.png"
              alt="Mascot Dog"
              class="border-dark-brown bg-warm-white mt-[0.5rem] h-[7rem] w-[7rem] rounded-full border-[0.125rem] object-cover p-[0.4rem]"
            />

            <!-- Sparkles (with Tailwind animation + inline positioning/delay) -->
            <span

            <span
              class="bg-golden-beige animate-sparkle absolute z-[2] h-[0.875rem] w-[0.875rem] shadow-[0_0_0.25rem_gold,0_0_0.625rem_rgba(255,215,0,0.7),0_0_0.875rem_rgba(255,255,200,0.5)] [clip-path:polygon(50%_0%,61%_35%,98%_35%,68%_57%,79%_91%,50%_70%,21%_91%,32%_57%,2%_35%,39%_35%)]"
              style="top: 0.625rem; right: -0.875rem; animation-delay: 0.3s"
            ></span>
            <span
              class="bg-golden-beige animate-sparkle absolute z-[2] h-[0.875rem] w-[0.875rem] shadow-[0_0_0.25rem_gold,0_0_0.625rem_rgba(255,215,0,0.7),0_0_0.875rem_rgba(255,255,200,0.5)] [clip-path:polygon(50%_0%,61%_35%,98%_35%,68%_57%,79%_91%,50%_70%,21%_91%,32%_57%,2%_35%,39%_35%)]"
              style="top: 45%; left: -1.125rem; animation-delay: 0.6s"
            ></span>
            <span
              class="bg-golden-beige animate-sparkle absolute z-[2] h-[0.875rem] w-[0.875rem] shadow-[0_0_0.25rem_gold,0_0_0.625rem_rgba(255,215,0,0.7),0_0_0.875rem_rgba(255,255,200,0.5)] [clip-path:polygon(50%_0%,61%_35%,98%_35%,68%_57%,79%_91%,50%_70%,21%_91%,32%_57%,2%_35%,39%_35%)]"
              style="bottom: 100%; left: 1.875rem; animation-delay: 0.9s"
            ></span>
            <span
              class="bg-golden-beige animate-sparkle absolute z-[2] h-[0.875rem] w-[0.875rem] shadow-[0_0_0.25rem_gold,0_0_0.625rem_rgba(255,215,0,0.7),0_0_0.875rem_rgba(255,255,200,0.5)] [clip-path:polygon(50%_0%,61%_35%,98%_35%,68%_57%,79%_91%,50%_70%,21%_91%,32%_57%,2%_35%,39%_35%)]"
              style="bottom: -0.875rem; right: 0.5rem; animation-delay: 1.2s"
            ></span>
            <span
              class="bg-golden-beige animate-sparkle absolute z-[2] h-[0.875rem] w-[0.875rem] shadow-[0_0_0.25rem_gold,0_0_0.625rem_rgba(255,215,0,0.7),0_0_0.875rem_rgba(255,255,200,0.5)] [clip-path:polygon(50%_0%,61%_35%,98%_35%,68%_57%,79%_91%,50%_70%,21%_91%,32%_57%,2%_35%,39%_35%)]"
              style="top: 1.5625rem; left: 70%; animation-delay: 1.5s"
            ></span>
            <span
              class="bg-golden-beige animate-sparkle absolute z-[2] h-[0.875rem] w-[0.875rem] shadow-[0_0_0.25rem_gold,0_0_0.625rem_rgba(255,215,0,0.7),0_0_0.875rem_rgba(255,255,200,0.5)] [clip-path:polygon(50%_0%,61%_35%,98%_35%,68%_57%,79%_91%,50%_70%,21%_91%,32%_57%,2%_35%,39%_35%)]"
              style="bottom: 0.75rem; left: 0rem; animation-delay: 1.8s"
            ></span>
            <span
              class="bg-golden-beige animate-sparkle absolute z-[2] h-[0.875rem] w-[0.875rem] shadow-[0_0_0.25rem_gold,0_0_0.625rem_rgba(255,215,0,0.7),0_0_0.875rem_rgba(255,255,200,0.5)] [clip-path:polygon(50%_0%,61%_35%,98%_35%,68%_57%,79%_91%,50%_70%,21%_91%,32%_57%,2%_35%,39%_35%)]"
              style="top: 60%; right: -0.625rem; animation-delay: 2.1s"
              >✧</span
            >
          </div>
        </div>

        <!-- Search Form -->
        <div class="relative ml-[0.5rem] flex-1">
          <form
            action="search-results.html"
            method="GET"
            class="relative flex flex-nowrap items-start justify-start gap-0 overflow-visible pr-0"
          >
            <!-- Sex -->
            <div
              class="ml-[2rem] flex min-w-[6.5rem] flex-col gap-y-[0.3rem] text-[0.85rem]"
            >
              <p
                class="text-soft-dark-purple mb-[0.8rem] text-[1rem] font-semibold"
              >
                Sex:
              </p>
              <label
                ><input
                  type="radio"
                  name="sex"
                  value="all"
                  checked
                  class="mr-[0.5rem]"
                />
                All</label
              >
              <label
                ><input
                  type="radio"
                  name="sex"
                  value="female"
                  class="mr-[0.5rem]"
                />
                Female</label
              >
              <label
                ><input
                  type="radio"
                  name="sex"
                  value="male"
                  class="mr-[0.5rem]"
                />
                Male</label
              >
            </div>

            <!-- Age -->
            <div
              class="flex min-w-[7rem] flex-col gap-y-[0.3rem] text-[0.85rem]"
            >
              <p
                class="text-soft-dark-purple mb-[0.8rem] text-[1rem] font-semibold"
              >
                Age:
              </p>
              <label
                ><input
                  type="radio"
                  name="age"
                  value="0-1"
                  class="mr-[0.5rem]"
                />
                0-1 year</label
              >
              <label
                ><input
                  type="radio"
                  name="age"
                  value="1-5"
                  class="mr-[0.5rem]"
                />
                1-5 years</label
              >
              <label
                ><input
                  type="radio"
                  name="age"
                  value="6+"
                  class="mr-[0.5rem]"
                />
                6+ years</label
              >
            </div>

            <!-- Size -->
            <div
              class="flex min-w-[7rem] flex-col gap-y-[0.3rem] text-[0.85rem]"
            >
              <p
                class="text-soft-dark-purple mb-[0.8rem] text-[1rem] font-semibold"
              >
                Size:
              </p>
              <label
                ><input
                  type="checkbox"
                  name="size"
                  value="small"
                  class="mr-[0.5rem]"
                />
                Small</label
              >
              <label
                ><input
                  type="checkbox"
                  name="size"
                  value="medium"
                  class="mr-[0.5rem]"
                />
                Medium</label
              >
              <label
                ><input
                  type="checkbox"
                  name="size"
                  value="large"
                  class="mr-[0.5rem]"
                />
                Large</label
              >
              <label
                ><input
                  type="checkbox"
                  name="size"
                  value="xlarge"
                  class="mr-[0.5rem]"
                />
                X-Large</label
              >
            </div>

            <!-- Country -->
            <div class="mr-[2.1rem] flex flex-col text-[0.85rem]">
              <p
                class="text-soft-dark-purple mb-[0.8rem] text-[1rem] font-semibold"
              >
                Country:
              </p>
              <select
                name="country"
                id="country"
                class="border-light-gray w-[7rem] rounded-[0.3125rem] border bg-white p-[0.25rem] text-[0.9rem]"
              >
                <option value="">-- Select Country --</option>
                <option value="estonia">All Countries</option>
                <option value="estonia">Estonia</option>
                <option value="latvia">Latvia</option>
                <option value="lithuania">Lithuania</option>
              </select>
            </div>

            <!-- Keyword -->
            <div class="mr-[2.1rem] flex flex-col text-[0.85rem]">
              <label
                for="keyword"
                class="text-soft-dark-purple mb-[0.8rem] text-[1rem] font-semibold"
                >Keyword</label
              >
              <input
                type="text"
                id="keyword"
                name="keyword"
                placeholder="e.g. breed"
                class="border-light-gray w-[7rem] rounded-[0.3125rem] border bg-white p-[0.25rem] text-[0.9rem]"
              />
              <small
                class="text-medium-brown mt-[0.2rem] w-[7rem] text-[0.75rem] opacity-80"
                >Optional — leave blank to search all dogs</small
              >
            </div>

            <!-- ID + Submit -->
            <div
              class="ml-[0.5rem] flex min-h-[10rem] flex-col items-start justify-start"
            >
              <p
                class="text-soft-dark-purple mb-[0.8rem] text-[1rem] font-semibold"
              >
                ID Number:
              </p>
              <input
                type="text"
                id="dog-id"
                name="dog-id"
                placeholder="Enter dog ID"
                class="border-light-gray w-[7rem] rounded-[0.3125rem] border bg-white p-[0.25rem] text-[0.9rem]"
              />
              <small
                class="text-medium-brown mt-[0.2rem] w-[7rem] text-[0.75rem] opacity-80"
                >Optional — to find dog by ID nr</small
              >

              <a
                href="2-search-results.html"
                class="mt-[1.2rem] ml-[0.2rem] flex max-w-[8rem] cursor-pointer items-center justify-center rounded-xl border-2 border-gray-300 bg-gray-100 py-1 pr-1 pl-2 text-base font-medium tracking-wide text-gray-600 shadow-xl transition-all duration-400 ease-in-out hover:bg-gray-200 hover:shadow-2xl"
              >
                SEARCH 🎉
              </a>
            </div>
          </form>
        </div>
      </div>

      <!-- Gallery Section -->

      <section
        aria-labelledby="gallery-heading"
        class="mx-auto mt-[0.5rem] max-w-screen-lg px-4"
      >
        <h2
          id="gallery-heading"
          class="text-deep-green mb-[0.5rem] text-center text-[1.3rem] font-semibold"
        >
          Bringing love, companionship & joy into your life
        </h2>

        <ul
          class="m-[0.2rem] grid w-full list-none grid-cols-2 gap-[1rem] p-0 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6"
        >
          <li>
            <img
              src="4-images/image1.jpg"
              alt="A loving dog"
              class="border-dark-brown aspect-[3.1/2.1] w-full rounded-[0.8rem] border-[0.19rem] object-cover object-[center_47%] shadow-[0_0.3rem_0.6rem_rgba(0,0,0,0.2),0_0.6rem_1.2rem_rgba(0,0,0,0.15),0_1rem_2rem_rgba(0,0,0,0.08)] transition-transform duration-400 ease-in-out"
            />
          </li>
          <li>
            <img
              src="4-images/image2.jpg"
              alt="A grateful dog"
              class="border-dark-brown aspect-[3.1/2.1] w-full rounded-[0.8rem] border-[0.19rem] object-cover object-[center_47%] shadow-[0_0.3rem_0.6rem_rgba(0,0,0,0.2),0_0.6rem_1.2rem_rgba(0,0,0,0.15),0_1rem_2rem_rgba(0,0,0,0.08)] transition-transform duration-400 ease-in-out"
            />
          </li>
          <li>
            <img
              src="4-images/image3.jpg"
              alt="The best companion"
              class="border-dark-brown aspect-[3.1/2.1] w-full rounded-[0.8rem] border-[0.19rem] object-cover object-[center_47%] shadow-[0_0.3rem_0.6rem_rgba(0,0,0,0.2),0_0.6rem_1.2rem_rgba(0,0,0,0.15),0_1rem_2rem_rgba(0,0,0,0.08)] transition-transform duration-400 ease-in-out"
            />
          </li>
          <li>
            <img
              src="4-images/image4.jpg"
              alt="Your most loyal friend"
              class="border-dark-brown aspect-[3.1/2.1] w-full rounded-[0.8rem] border-[0.19rem] object-cover object-[center_47%] shadow-[0_0.3rem_0.6rem_rgba(0,0,0,0.2),0_0.6rem_1.2rem_rgba(0,0,0,0.15),0_1rem_2rem_rgba(0,0,0,0.08)] transition-transform duration-400 ease-in-out"
            />
          </li>
          <li>
            <img
              src="4-images/image5.jpg"
              alt="The perfect guard dog for your security"
              class="border-dark-brown aspect-[3.1/2.1] w-full rounded-[0.8rem] border-[0.19rem] object-cover object-[center_47%] shadow-[0_0.3rem_0.6rem_rgba(0,0,0,0.2),0_0.6rem_1.2rem_rgba(0,0,0,0.15),0_1rem_2rem_rgba(0,0,0,0.08)] transition-transform duration-400 ease-in-out"
            />
          </li>
          <li>
            <img
              src="4-images/image6.jpg"
              alt="A puppy who needs a loving home and family"
              class="border-dark-brown aspect-[3.1/2.1] w-full rounded-[0.8rem] border-[0.19rem] object-cover object-[center_47%] shadow-[0_0.3rem_0.6rem_rgba(0,0,0,0.2),0_0.6rem_1.2rem_rgba(0,0,0,0.15),0_1rem_2rem_rgba(0,0,0,0.08)] transition-transform duration-400 ease-in-out"
            />
          </li>
        </ul>
      </section>
    </main>

    <div data-include="3-html-partials/footer.html"></div>

    <script src="5-js/include.js" defer></script>
