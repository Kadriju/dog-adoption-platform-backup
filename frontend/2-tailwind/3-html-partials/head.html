<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Find your perfect dog | Dogeli</title>

    <!-- Tailwind build -->
    <link rel="stylesheet" href="/1-dist/output.css" />

    <!-- Favicon -->
    <link rel="icon" href="/4-images/favicon.ico" sizes="any" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Icon library -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- SEO -->
    <link rel="canonical" href="https://www.dogeli.com/" />
    <meta
      name="description"
      content="Find your perfect dog. Adopt or buy responsibly. Europe’s hub for dog lovers."
    />
    <meta name="robots" content="index,follow" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light dark" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Dogeli" />
    <meta
      property="og:title"
      content="Find your perfect dog. Adopt or buy responsibly. Europe’s hub for dog lovers."
    />
    <meta
      property="og:description"
      content="Find your perfect dog. Adopt or buy responsibly. Europe’s hub for dog lovers."
    />
    <meta property="og:url" content="https://www.dogeli.com/" />
    <meta property="og:image" content="https://www.dogeli.com/4-images/logosocialmedia.png" />
    <meta property="og:image:alt" content="Dogeli — Find your perfect dog" />
    <!-- Optional but helpful -->
    <meta property="og:image:width" content="1125" />
    <meta property="og:image:height" content="1125" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Find your perfect dog. Adopt or buy responsibly. Europe’s hub for dog lovers."
    />
    <meta
      name="twitter:description"
      content="Find your perfect dog. Adopt or buy responsibly. Europe’s hub for dog lovers."
    />
    <meta name="twitter:image" content="https://www.dogeli.com/4-images/logosocialmedia.png" />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Dogeli",
        "url": "https://www.dogeli.com",
        "logo": "https://www.dogeli.com/4-images/logoheader.png",
        "sameAs": [
          "https://www.facebook.com/dogeli",
          "https://www.instagram.com/dogeli/"
        ],
        "contactPoint": [
          {
            "@type": "ContactPoint",
            "contactType": "Customer Support",
            "email": "info@dogeli.com"
          }
        ]
      }
    </script>
  </head>
</html>
