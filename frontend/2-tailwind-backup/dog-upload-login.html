<!DOCTYPE html>
<html lang="en">
  <head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Tailwind CDN -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- Tailwind Custom Config -->
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['Poppins', 'sans-serif'],
        },
        colors: {
          // Neutral
          black: '#000000',
          white: '#FFFFFF',
          warmWhite: '#FAF3E0',
          lightGray: '#cccccc',

          // Yellow & Gold
          goldenBeige: '#E3C27E',
          pastelYellow: '#ffe082',
          softMustard: '#D8B25C',
          warmGoldenYellow: '#E4AF28',

          // Peach, Rose & Coral
          softPeach: '#FDE9E0',
          mutedRose: '#C98585',
          mutedCoral: '#E6A4B4',
          mediumSalmon: '#E56767',
          rosyBrown: '#b76e79',

          // Lavender & Purple
          mutedLavender: '#A784AF',
          softDarkPurple: '#5D3A6A',
          darkGrape: '#46265A',

          // Brown & Taupe
          lightChestnut: '#B38B6D',
          warmTaupe: '#C2A28D',
          mediumBrown: '#6B5843',
          darkBrown: '#5C4326',

          // Green & Teal
          sageGreen: '#A8BBA2',
          mutedTeal: '#6B9080',
          deepGreenTeal: '#38584F',
          deepGreen: '#3b6f58',

          // Blue
          powderBlue: '#BFD7EA',
          royalBlue: '#3a7fc1',

          // Other UI-specific
          textDark: '#3D2A19',
          logoFrame: '#7E3E20',
        },
        spacing: {
          '0.1875': '0.1875rem',
          '0.375': '0.375rem',
          '0.625': '0.625rem',
          '1.25': '1.25rem',
          '2.2': '2.2rem',
          '3.9': '3.9rem',
          '6.25': '6.25rem',
          '7': '1.75rem',
          '28': '7rem',
        },
        borderRadius: {
          '7xl': '7rem',
        },
        
        boxShadow: {
          donate: 'inset 0.1875rem 0.1875rem 0.375rem rgba(255,255,255,0.85), inset -0.1875rem -0.1875rem 0.5rem rgba(0,0,0,0.08), 0 0.25rem 0.5rem rgba(0,0,0,0.3), 0 0.625rem 1.25rem rgba(233,155,155,0.4), 0 0 1rem rgba(255,200,200,0.2)'
        },


        keyframes: {
          glow: {
            '0%, 100%': {
              textShadow: '0 0 0.1875rem #3D2A19, 0 0 0.375rem #3D2A19, 0.0625rem 0.0625rem 0.125rem #3D2A19, -0.0625rem -0.0625rem 0.125rem #3D2A19',
            },
            '50%': {
              textShadow: '0 0 0.375rem #3D2A19, 0 0 0.75rem #3D2A19, 0.0625rem 0.0625rem 0.25rem #3D2A19, -0.0625rem -0.0625rem 0.25rem #3D2A19',
            },
          },
          glowPurple: {
            '0%': {
              textShadow: '0 0 0.375rem #C5A8E8, 0 0 0.625rem #D6B8F3, 0 0 0.875rem #E9D6FA',
            },
            '50%': {
              textShadow: '0 0 0.625rem #D6B8F3, 0 0 1.125rem #E9D6FA, 0 0 1.5rem #ffffff',
            },
            '100%': {
              textShadow: '0 0 0.375rem #C5A8E8, 0 0 0.625rem #D6B8F3, 0 0 0.875rem #E9D6FA',
            },
          },
          glowGold: {
            '0%, 100%': {
              textShadow: '0 0 0.2rem rgba(233, 155, 155, 0.3), 0 0 0.4rem rgba(233, 155, 155, 0.3)',
            },
            '50%': {
              textShadow: '0 0 0.5rem rgba(233, 155, 155, 0.5), 0 0 1rem rgba(233, 155, 155, 0.5)',
            },
          },
          sparkleTwinkle: {
            '0%': { opacity: '0', transform: 'scale(0.4) rotate(0deg)' },
            '30%': { opacity: '1', transform: 'scale(1.2) rotate(72deg)' },
            '60%': { opacity: '1', transform: 'scale(1) rotate(144deg)' },
            '100%': { opacity: '0', transform: 'scale(0.4) rotate(360deg)' },
          },
        },
        animation: {
          glow: 'glow 2s ease-in-out infinite',
          glowPurple: 'glowPurple 2s ease-in-out infinite',
          glowGold: 'glowGold 2s ease-in-out infinite',
          sparkle: 'sparkleTwinkle 2.5s ease-in-out infinite',
        },
        screens: {
          xs: '480px',
          sm: '640px',
          md: '768px',
          lg: '1024px',
          xl: '1280px',
          '2xl': '1536px',
        },
      }
    }
  }
</script>

  <!-- SEO Metadata -->
 
  <meta name="description" content="Search, browse and find homeless dogs from shelters across Europe. Find your new best friend & soulmate and give a dog a loving home & family today through Dogs of Europe." />
  <meta name="keywords" content="dogs, dog adoption, adopt a dog, adoption, dog shelters, shelter dogs Europe, dogs for adoption, homeless dogs, rescue dogs, European dog shelters, best friend, soulmate, love of your life, personal trainer, companion, find a perfect partner" />
  <meta name="author" content="Dogs of Europe Team" />

  <link rel="icon" href="images/favicon.ico" type="image/x-icon" />
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">


  <!-- Font Awesome (for fa-search icon) -->

  <link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
/>

 <!-- Structured Data for SEO -->

<script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Dogs of Europe",
    "url": "https://www.dogsofeurope.com",
    "logo": "https://www.dogsofeurope.com/images/logo.png",
    "description": "Browse and adopt dogs from shelters across Europe.",
    "sameAs": [
      "https://www.dogsofeurope.com",
      "https://www.dogsofeurope.org",
      "https://www.dogsofeurope.eu",
      "https://www.facebook.com/dogsofeurope",
      "https://www.instagram.com/dogsofeurope_official/"
   ],
    "contactPoint": {
      "@type": "ContactPoint",
      "email": "info@dogsofeurope.com",
      "contactType": "Customer Support"
    }
  }
  </script>  
</head>

  <body>
    <div data-include="html-partials/header.html"></div>

    <!-- LOGIN FORM -->
    <main class="main-login-page">
      <section class="login-page-wrapper">

        <!-- Upload Form for Private Users -->
        <div class="login-page">
          <div class="login-container">
            <h2 class="login-title">Submit a Dog for Adoption 🐶 🐾</h2>

            <!-- Content block -->
            <div class="login-content">
              <form class="login-form" id="upload-form">
                <label for="dog-count">How many dogs are you uploading?</label>
                <select id="dog-count" name="dog-count">
                  <option value="1">1 dog</option>
                  <option value="2">2 dogs</option>
                  <option value="3">3 dogs</option>
                  <option value="4">4 dogs</option>
                  <option value="5">5 dogs</option>
                  <option value="6">6 dogs</option>
                  <option value="7">7 dogs</option>
                  <option value="8">8 dogs</option>
                  <option value="9">9 dogs</option>
                  <option value="10">10 dogs</option>
                  <option value="11">11 dogs</option>
                  <option value="12">12 dogs</option>
                </select>

                <p class="price-summary">
                  Total price: <strong id="total-price">€9.90</strong><br />
                  <small id="price-per-dog">(€9.90 per dog)</small>
                </p>
              </form>
            </div>

            <!-- Spacer to push button down -->
            <div class="spacer"></div>

            <button class="login-button" type="submit" form="upload-form">🎉 Continue to Upload</button>
          </div>
        </div>

        <!-- Shelter Login -->
        <div class="login-page">
          <div class="login-container">
            <h2 class="login-title">🏠 Shelter Login</h2>

            <div class="login-content">
              <form class="login-form">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" />

                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" />
              </form>
            </div>

            <div class="spacer"></div>

            <button class="login-button" type="submit" form="login-form">Login</button>

      </section>
    </main>

    <div data-include="html-partials/footer.html"></div>

    <script src="js/include.js"></script>

    <script src="js/tiered-pricing.js" defer></script>

  </body>
</html>
