<!DOCTYPE html> 
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- SEO Metadata -->

  <title>Adopt your new best friend | Dogs of Europe</title> 
 
  <meta name="description" content="Search, browse and find homeless dogs from shelters across Europe. Find your new best friend & soulmate and give a dog a loving home & family today through Dogs of Europe." />
  <meta name="keywords" content="dogs, dog adoption, adopt a dog, adoption, dog shelters, shelter dogs Europe, dogs for adoption, homeless dogs, rescue dogs, European dog shelters, best friend, soulmate, love of your life, personal trainer, companion, find a perfect partner" />
  <meta name="author" content="Dogs of Europe Team" />

  <link rel="icon" href="images/favicon.ico" type="image/x-icon" />
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">


  <!-- Font Awesome (for fa-search icon) -->

  <link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
  />

  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/home.css" />

 <!-- Structured Data for SEO -->

<script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Dogs of Europe",
    "url": "https://www.dogsofeurope.com",
    "logo": "https://www.dogsofeurope.com/images/logo.png",
    "description": "Browse and adopt dogs from shelters across Europe.",
    "sameAs": [
      "https://www.dogsofeurope.com",
      "https://www.dogsofeurope.org",
      "https://www.dogsofeurope.eu",
      "https://www.facebook.com/dogsofeurope",
      "https://www.instagram.com/dogsofeurope_official/"
   ],
    "contactPoint": {
      "@type": "ContactPoint",
      "email": "info@dogsofeurope.com",
      "contactType": "Customer Support"
    }
  }
  </script>  
</head>


<body>

  <div data-include="html-partials/header.html"></div>
 
  <!-- Main Content -->

  <main id="main-content" role="main">

<!-- Hero Section -->

<section class="hero" aria-labelledby="main-heading">
  <div class="container">
    <h1 id="main-heading" class="hero__title highlighted-text">Find Your New Best Friend !</h1>
     <p class="hero__subtitle">
      <span class="heart">♥</span>
      Give a loving home to a grateful dog
      <span class="heart">♥</span>
    </p>
  </div>
</section>

<!-- Search Section -->

<div class="search">
  <div class="container">

    <div class="search__sidebar">
      <h2 class="search__title">
        Dog Search <i class="fa-solid fa-location-dot"></i>
      </h2>

      <div class="sparkle-wrapper">
        <img src="images/mascot.png" alt="Mascot Dog" class="mascot-img" />

        <!-- Fancy golden sparkles -->

        <span class="sparkle sparkle--1"></span>
        <span class="sparkle sparkle--2"></span>
        <span class="sparkle sparkle--3"></span>
        <span class="sparkle sparkle--4"></span>
        <span class="sparkle sparkle--5"></span>
        <span class="sparkle sparkle--6"></span>
        <span class="sparkle sparkle--7"></span>
        <span class="sparkle sparkle--8">✧</span>
      </div>
    </div>
  </div> 

  <!-- Form and search fields -->

  <div class="search__form-wrapper">
    <form class="search__form" action="search-results.html" method="GET">

      <div class="search__form-group sex">
        <p class="form-title">Sex:</p>
        <label><input type="radio" name="sex" value="all" checked /> All</label>
        <label><input type="radio" name="sex" value="female" /> Female</label>
        <label><input type="radio" name="sex" value="male" /> Male</label>
      </div>

      <div class="search__form-group age">
        <p class="form-title">Age:</p>
        <label><input type="radio" name="age" value="0-1" /> 0–1 year</label>
        <label><input type="radio" name="age" value="1-5" /> 1–5 years</label>
        <label><input type="radio" name="age" value="6+" /> 6+ years</label>
      </div>

      <div class="search__form-group size">
        <p class="form-title">Size:</p>
        <label><input type="checkbox" name="size" value="small" /> Small</label>
        <label><input type="checkbox" name="size" value="medium" /> Medium</label>
        <label><input type="checkbox" name="size" value="large" /> Large</label>
        <label><input type="checkbox" name="size" value="xlarge" /> X-Large</label>
      </div>

      <div class="search__form-group country">
        <p class="form-title">Country:</p>
        <select id="country" name="country">
          <option value="">-- Select Country --</option>
          <option value="estonia">All Europe</option>
          <option value="estonia">Estonia</option>
          <option value="latvia">Latvia</option>
          <option value="lithuania">Lithuania</option>
        </select>
      </div>

      <div class="search__form-group id keyword">
        <label for="keyword" class="form-title">Keyword</label>
        <input type="text" id="keyword" name="keyword" placeholder="e.g. breed or trait" />
        <small class="form-hint">Optional — leave blank to search all dogs</small>
      </div>


      <div class="search__form-group id">
        <p class="form-title">ID Number:</p>
        <input type="text" id="dog-id" name="dog-id" placeholder="Enter dog ID" />
        <small class="form-hint">Optional — leave blank unless you know the ID</small>
        <button class="search__submit" type="submit">SEARCH</button>
      </div>

    </form> 
  </div>
</div>

  <!-- Gallery Section -->

<section class="container" aria-labelledby="gallery-heading">
  <h2 id="gallery-heading" class="gallery__heading">Bringing love, companionship & joy into your life</h2>
  <ul class="gallery__grid">
    <li><img src="images/image1.jpg" alt="A loving dog" /></li>
    <li><img src="images/image2.jpg" alt="A grateful dog" /></li>
    <li><img src="images/image3.jpg" alt="The best companion" /></li>
    <li><img src="images/image4.jpg" alt="Your most loyal friend" /></li>
    <li><img src="images/image5.jpg" alt="The perfect guard dog for your security" /></li>
    <li><img src="images/image6.jpg" alt="A puppy who needs a loving home and family" /></li>
  </ul>
</section>

</main>

  <div data-include="html-partials/footer.html"></div>

<script src="js/include.js"></script>

</body>
</html>
