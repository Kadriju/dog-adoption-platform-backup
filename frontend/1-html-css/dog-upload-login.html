<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- SEO Metadata -->

  <title>Upload a dog / shelter Login | Dogs of Europe</title>
  <meta name="description" content="Search, browse and find homeless dogs from shelters across Europe. Find your new best friend & soulmate and give a dog a loving home & family today through Dogs of Europe." />
  <meta name="keywords" content="dogs, dog adoption, adopt a dog, adoption, dog shelters, shelter dogs Europe, dogs for adoption, homeless dogs, rescue dogs, European dog shelters, best friend, soulmate, love of your life, personal trainer, companion, find a perfect partner" />
  <meta name="author" content="Dogs of Europe Team" />

  <link rel="icon" href="images/favicon.ico" type="image/x-icon" />
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">


  <!-- Font Awesome (for fa-search icon) -->

  <link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
  />

  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/dog-upload-login.css" />

 <!-- Structured Data for SEO -->

<script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Dogs of Europe",
    "url": "https://www.dogsofeurope.com",
    "logo": "https://www.dogsofeurope.com/images/logo.png",
    "description": "Browse and adopt dogs from shelters across Europe.",
    "sameAs": [
      "https://www.dogsofeurope.com",
      "https://www.dogsofeurope.org",
      "https://www.dogsofeurope.eu",
      "https://www.facebook.com/dogsofeurope",
      "https://www.instagram.com/dogsofeurope_official/"
   ],
    "contactPoint": {
      "@type": "ContactPoint",
      "email": "info@dogsofeurope.com",
      "contactType": "Customer Support"
    }
  }
  </script>  
</head>

<body>

  <div data-include="html-partials/header.html"></div>
  
        <!-- LOGIN FORM -->
        <main class="login-page">
          <section class="login-container">
            <h1 class="login-title">Shelter Login</h1>
            <form action="/shelter-dashboard" method="POST" class="login-form">
              
              <label for="email">Email Address</label>
              <input type="email" id="email" name="email" required placeholder="you@example.com" />
      
              <label for="password">Password</label>
              <input type="password" id="password" name="password" required placeholder="Enter your password" />
      
              <button type="submit" class="login-button">Log In</button>
      
              <p class="login-help">
                Forgot your password? <a href="/reset-password">Reset it here</a>.
              </p>
            </form>
          </section>
        </main>

        <div data-include="html-partials/footer.html"></div>

        <script src="js/include.js"></script>
      
      </body>
</html>
